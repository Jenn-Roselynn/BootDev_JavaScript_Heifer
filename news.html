<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>🚨 Breaking News</title>
    <style>
      :root {
        --bg-color: #ffffff;
        --text-color: #000000;
        --button-bg: #252936;
        --button-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --text-color: #ffffff;
          --button-bg: #b2c1d0;
          --button-text: #000000;
        }
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        /* Ensure the body is the flex container */
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      h1 {
        color: #d32f2f;
        margin: 0.5em 0;
      }

      @media (prefers-color-scheme: dark) {
        h1 { color: #ff5555; }
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        display: none;
        border-radius: 8px;
        background-color: var(--button-bg);
        color: var(--button-text);
        border: none;
        margin-top: 10px;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
    
    <script type="module">
      import confetti from "https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/+esm";

      const button = document.getElementById("celebrate");
      const headline = document.getElementById("headline");
      const loadingText = document.getElementById("loading-text");

      if (button) {
        button.style.display = "inline-block";
        button.addEventListener("click", () => {
          confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
          });
        });
      }

      if (headline) headline.textContent = "🚀 JavaScript Takes Over the World!";
      if (loadingText) loadingText.style.display = "none";
    </script>
  </head>
  <body>
    <h1 id="headline">Loading latest news...</h1>
    <p id="loading-text">
      (Please wait... our top reporters are investigating!)
    </p>
    <button id="celebrate">Celebrate the News! 🎉</button>
  </body>
</html>
